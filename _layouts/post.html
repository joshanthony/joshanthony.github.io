---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% assign display_date = page.last_modified_at | default: page.date %}
    {% assign md_raw_url = "https://raw.githubusercontent.com/" | append: site.repository | append: "/main/" | append: page.path %}
    <p class="post-meta post-meta-row">
      <time datetime="{{ display_date | date_to_xmlschema }}">{{ display_date | date: "%b %-d, %Y" }}</time>
      <button type="button" class="copy-post-md" data-copy-md data-md-url="{{ md_raw_url }}">Copy text</button>
    </p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
