---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% assign display_date = page.last_modified_at | default: page.date %}
    <p class="post-meta">
      <time datetime="{{ display_date | date_to_xmlschema }}">{{ display_date | date: "%b %-d, %Y" }}</time>
    </p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
