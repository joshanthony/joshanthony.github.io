<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}" />
    <meta name="author" content="{{ site.author | escape }}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}" />
    <meta property="og:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}" />
    <meta name="twitter:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header" role="banner">
      <div class="container">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="Primary" class="nav">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Blog</a>
          <a href="{{ '/prompts/' | relative_url }}" {% if page.url == '/prompts/' %}aria-current="page"{% endif %}>Prompts</a>
          <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
          <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color theme">
            <span class="theme-icon" aria-hidden="true"></span>
            <span class="sr-only">Toggle color theme</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="content" class="prompts-outer" role="main">
      <div class="prompts-page">
        <aside class="prompts-sidebar">
          <nav aria-label="Prompts contents">
            <ul class="prompts-nav-list">
              <li><a href="#research">Research</a></li>
              <li><a href="#plan">Plan</a></li>
              <li><a href="#review">Review</a></li>
              <li><a href="#todo">To-Do</a></li>
              <li><a href="#implement">Implement</a></li>
            </ul>
          </nav>
        </aside>
        <div class="prompts-content">
          {{ content }}
        </div>
      </div>
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <p>© {{ 'now' | date: '%Y' }} {{ site.title }}</p>
      </div>
    </footer>

    <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
